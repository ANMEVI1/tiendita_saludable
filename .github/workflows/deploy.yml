name: Deploy to InfinityFree FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde GitHub

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Obtener el código más reciente
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
      
    - name: 📂 Sincronizar archivos por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        
        # InfinityFree normalmente requiere que los archivos públicos se suban a htdocs/
        server-dir: htdocs/
        
        # Ignorar archivos innecesarios en producción
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          propuestas/**
          README.md
